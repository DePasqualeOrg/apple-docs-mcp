name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm
        run: npm install --global npm@12.0.2 --ignore-scripts --min-release-age=3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run compile

      - name: Verify package
        run: |
          # Check package.json version matches tag
          PACKAGE_VERSION=v$(node -p "require('./package.json').version")
          TAG_NAME=${GITHUB_REF#refs/tags/}

          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "❌ Package version ($PACKAGE_VERSION) doesn't match tag ($TAG_NAME)"
            exit 1
          fi

          echo "✅ Version check passed: $PACKAGE_VERSION"

      - name: Prepare and verify bundled dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --min-release-age=3 --no-audit --no-fund
          mkdir -p /tmp/npm-package
          npm pack --ignore-scripts --json --pack-destination /tmp/npm-package > /tmp/npm-pack.json
          node scripts/dependency-maintenance.mjs verify-pack /tmp/npm-pack.json
          npm_config_cache=/tmp/npm-smoke-cache npm install --prefix /tmp/npm-package-smoke --ignore-scripts --offline --no-audit --no-fund /tmp/npm-package/*.tgz
          test -f /tmp/npm-package-smoke/node_modules/@kimsungwhee/apple-docs-mcp/node_modules/@modelcontextprotocol/sdk/package.json
          test -f /tmp/npm-package-smoke/node_modules/@kimsungwhee/apple-docs-mcp/node_modules/zod/package.json

      - name: Publish to npm
        run: npm publish /tmp/npm-package/*.tgz --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          body: |
            ## 🚀 Published to npm

            Install with:
            ```bash
            npm install @kimsungwhee/apple-docs-mcp
            ```

            ## 📦 What's included
            - Complete WWDC video data (1260+ videos)
            - 18 MCP tools for Apple documentation
            - Full TypeScript support
            - Bundled data (no external dependencies)

            ## 📝 Changelog
            See the [full changelog](https://github.com/kimsungwhee/apple-docs-mcp/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
